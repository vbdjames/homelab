---
# Run with --action test first to preview renames, then change to --action move.
# Check results: kubectl logs -n arr job/filebot-rename
# Delete job before re-running: kubectl delete job -n arr filebot-rename
apiVersion: batch/v1
kind: Job
metadata:
  name: filebot-rename
  namespace: arr
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: filebot
          image: ghcr.io/filebot/filebot
          command:
            - filebot
            - -rename
            - /media/fromemby
            - --db
            - TheMovieDB
            - --format
            - "{n} ({y})/{n} ({y})"
            - --action
            - test
            - -non-strict
          volumeMounts:
            - name: media
              mountPath: /media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: arr-media
