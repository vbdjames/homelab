---
# Homelab Ansible Inventory
# Project root: ~/homelab
#
# Groups:
#   k8s_control_plane  — hl-01 (4GB/15GB, k8s control plane)
#   k8s_workers        — hl-02 through hl-06 (8GB, k8s workers)
#   homelab            — all of the above (parent group)
#
# Note: nas-01 (Synology DiskStation) is not managed by Ansible — see nas-runbook.md

all:
  children:
    homelab:
      children:

        k8s_control_plane:
          hosts:
            hl-01:
              ansible_host: 192.168.1.200  # 4GB RAM / 15GB storage — k8s control plane

        k8s_workers:
          hosts:
            hl-02:
              ansible_host: 192.168.1.201
            hl-03:
              ansible_host: 192.168.1.202
            hl-04:
              ansible_host: 192.168.1.203
            hl-05:
              ansible_host: 192.168.1.204
            hl-06:
              ansible_host: 192.168.1.205

  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/ansible_homelab
    ansible_python_interpreter: /usr/bin/python3
