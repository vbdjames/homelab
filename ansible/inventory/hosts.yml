---
# Homelab Ansible Inventory
#
# Groups:
#   k8s_control_plane  — hl-01 (4GB, k8s control plane)
#   k8s_workers        — hl-02 through hl-07 (hl-02–06: 8GB Wyse 5070; hl-07: 4GB HP 8200 Elite with optical drive)
#   homelab            — all of the above (parent group)
#   proxmox            — pve-01 Proxmox hypervisor
#   pihole             — Pi-hole LXC (managed via Proxmox)
#
# Note: nas (Synology DiskStation) is not managed by Ansible — see nas-runbook.md

all:
  children:
    homelab:
      children:

        k8s_control_plane:
          hosts:
            hl-01:
              ansible_host: 192.168.1.150

        k8s_workers:
          hosts:
            hl-02:
              ansible_host: 192.168.1.151
            hl-03:
              ansible_host: 192.168.1.152
            hl-04:
              ansible_host: 192.168.1.153
            hl-05:
              ansible_host: 192.168.1.154
            hl-06:
              ansible_host: 192.168.1.155
            hl-07:
              ansible_host: 192.168.1.156

    proxmox:
      hosts:
        pve-01:
          ansible_host: 192.168.1.160
          ansible_user: root

    pihole:
      hosts:
        pihole:
          ansible_host: 192.168.1.161

