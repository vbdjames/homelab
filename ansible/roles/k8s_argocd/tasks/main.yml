---
# -------------------------------------------------------------------------
# ArgoCD bootstrap — run once after cluster is healthy
# After this, ArgoCD manages all further cluster state via GitOps.
# -------------------------------------------------------------------------

- name: Create argocd namespace
  kubernetes.core.k8s:
    name: argocd
    api_version: v1
    kind: Namespace
    state: present
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"

- name: Install ArgoCD
  ansible.builtin.command:
    cmd: >
      kubectl apply -n argocd --server-side
      -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  changed_when: false

- name: Wait for ArgoCD server deployment
  ansible.builtin.command:
    cmd: >
      kubectl wait deployment/argocd-server
      -n argocd
      --for=condition=Available
      --timeout=300s
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  changed_when: false

- name: Expose ArgoCD server via NodePort (temporary — MetalLB will replace this)
  ansible.builtin.command:
    cmd: >
      kubectl patch svc argocd-server -n argocd
      -p '{"spec": {"type": "NodePort"}}'
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  changed_when: false

- name: Get ArgoCD initial admin password
  ansible.builtin.command:
    cmd: >
      kubectl -n argocd get secret argocd-initial-admin-secret
      -o jsonpath="{.data.password}"
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  register: argocd_password_b64
  changed_when: false

- name: Display ArgoCD access information
  ansible.builtin.debug:
    msg:
      - "ArgoCD is ready."
      - "Run: kubectl get svc argocd-server -n argocd  (for NodePort)"
      - "URL: https://{{ ansible_host }}:<nodeport>"
      - "Username: admin"
      - "Password: {{ argocd_password_b64.stdout | b64decode }}"
