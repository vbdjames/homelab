---
# -------------------------------------------------------------------------
# Swap — must be disabled for kubelet
# -------------------------------------------------------------------------
- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] > 0
  changed_when: false

- name: Remove swap entry from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+sw\s.*)$'
    replace: '# \1'

# -------------------------------------------------------------------------
# Kernel modules — required by containerd and Kubernetes networking
# -------------------------------------------------------------------------
- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'

# -------------------------------------------------------------------------
# Sysctl — required for Kubernetes networking
# -------------------------------------------------------------------------
- name: Set sysctl parameters for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present
    reload: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables,  value: '1' }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: '1' }
    - { name: net.ipv4.ip_forward,                 value: '1' }

# -------------------------------------------------------------------------
# containerd — container runtime
# -------------------------------------------------------------------------
- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }} stable
    state: present
    filename: docker

- name: Install containerd
  ansible.builtin.apt:
    name: "containerd.io={{ containerd_version }}*"
    state: present
    update_cache: true

- name: Create /etc/containerd directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Generate default containerd config
  ansible.builtin.shell:
    cmd: containerd config default > /etc/containerd/config.toml
  # Always regenerate — the Docker package ships a config with disabled_plugins = ["cri"]
  # which breaks kubeadm. Do not use 'creates:' here.
  changed_when: true
  notify: Restart containerd

- name: Enable SystemdCgroup in containerd config
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '(^\s*SystemdCgroup\s*=\s*)false'
    replace: '\1true'
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true

# -------------------------------------------------------------------------
# UFW — disable on k8s nodes; Cilium handles network policy
# -------------------------------------------------------------------------
- name: Disable UFW on Kubernetes nodes
  community.general.ufw:
    state: disabled

# -------------------------------------------------------------------------
# Static IP — netplan
# Takes ownership from cloud-init by removing the installer-generated config
# before writing ours. ansible_host is the authoritative IP for this node.
# -------------------------------------------------------------------------
- name: Remove cloud-init netplan config
  ansible.builtin.file:
    path: /etc/netplan/00-installer-config.yaml
    state: absent

- name: Write netplan static IP configuration
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: /etc/netplan/01-k8s-static.yaml
    mode: '0600'
  notify: Apply netplan
  # If ansible_host changes, netplan apply will briefly drop the SSH connection.
