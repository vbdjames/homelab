---
# Homepage needs read access to the Kubernetes API for service status widgets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Home:
        style: row
        columns: 3
      Infrastructure:
        style: row
        columns: 3

  widgets.yaml: |
    - greeting:
        text_size: xl
        text: Welcome home.
    - search:
        provider: google
        target: _blank
    - diskstation:
        url: http://192.168.1.3:5000
        username: "{{HOMEPAGE_VAR_NAS_USERNAME}}"
        password: "{{HOMEPAGE_VAR_NAS_PASSWORD}}"
        volume: /volume1
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelab
        nodes:
          show: false

  services.yaml: |
    - Home:
        - Paperless:
            href: https://paperless.fiddlestick.org
            description: Document management
            icon: paperless-ngx.png
        - Calibre-Web:
            href: https://books.fiddlestick.org
            description: Ebook library
            icon: calibre-web.png

    - Infrastructure:
        - Grafana:
            href: https://grafana.fiddlestick.org
            description: Metrics and dashboards
            icon: grafana.png
        - Alertmanager:
            href: https://alertmanager.fiddlestick.org
            description: Alert routing and notifications
            icon: alertmanager.png
        - ArgoCD:
            href: https://argocd.fiddlestick.org
            description: GitOps deployments
            icon: argo-cd.png

  bookmarks.yaml: |
    []

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: |
    {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      initContainers:
        - name: copy-config
          image: busybox
          command:
            - sh
            - -c
            - cp /config-source/*.yaml /app/config/
          volumeMounts:
            - name: config-source
              mountPath: /config-source
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.12.3
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.fiddlestick.org
            - name: HOMEPAGE_VAR_NAS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homepage-nas
                  key: username
            - name: HOMEPAGE_VAR_NAS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homepage-nas
                  key: password
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
      volumes:
        - name: config-source
          configMap:
            name: homepage-config
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector:
    app: homepage
  ports:
    - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - home.fiddlestick.org
      secretName: homepage-tls
  rules:
    - host: home.fiddlestick.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
