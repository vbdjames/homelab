---
# Homepage needs read access to the Kubernetes API for service status widgets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Home:
        tab: Home
        style: row
        columns: 3
      Infrastructure:
        tab: Admin
        style: row
        columns: 3
      Media Management:
        tab: Admin
        style: row
        columns: 3

  widgets.yaml: |
    - greeting:
        text_size: xl
        text: Welcome home.
    - search:
        provider: google
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelab
        nodes:
          show: false

  services.yaml: |
    - Home:
        - Paperless:
            href: https://paperless.fiddlestick.org
            description: Document management
            icon: paperless-ngx.png
            widget:
              type: paperlessngx
              url: http://paperless.paperless.svc.cluster.local:8000
              key: "{{HOMEPAGE_VAR_PAPERLESS_TOKEN}}"
        - Calibre-Web:
            href: https://books.fiddlestick.org
            description: Ebook library
            icon: calibre-web.png
            widget:
              type: calibreweb
              url: http://calibre-web.calibre-web.svc.cluster.local:8083
              username: "{{HOMEPAGE_VAR_CALIBRE_USERNAME}}"
              password: "{{HOMEPAGE_VAR_CALIBRE_PASSWORD}}"
        - Jellyfin:
            href: https://jellyfin.fiddlestick.org
            description: Media server
            icon: jellyfin.png
            widget:
              type: jellyfin
              url: http://jellyfin.jellyfin.svc.cluster.local:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
              enableBlocks: true
              version: 2

    - Infrastructure:
        - Proxmox:
            href: https://pve-01.fiddlestick.org:8006
            description: Hypervisor
            icon: proxmox.png
            widget:
              type: proxmox
              url: https://192.168.1.160:8006
              username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"
              node: pve-01
        - Pi-hole:
            href: https://pihole.fiddlestick.org/admin
            description: DNS and DHCP
            icon: pi-hole.png
            widget:
              type: pihole
              url: http://192.168.1.161
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_PASSWORD}}"
        - Synology NAS:
            href: http://192.168.1.3:5000
            description: Network attached storage
            icon: synology-dsm.png
            widget:
              type: diskstation
              url: http://192.168.1.3:5000
              username: "{{HOMEPAGE_VAR_NAS_USERNAME}}"
              password: "{{HOMEPAGE_VAR_NAS_PASSWORD}}"
              volume: volume_1
        - Grafana:
            href: https://grafana.fiddlestick.org
            description: Metrics and dashboards
            icon: grafana.png
        - Alertmanager:
            href: https://alertmanager.fiddlestick.org
            description: Alert routing and notifications
            icon: alertmanager.png
        - ArgoCD:
            href: https://argocd.fiddlestick.org
            description: GitOps deployments
            icon: argo-cd.png
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"

    - Media Management:
        - Sonarr:
            href: https://sonarr.fiddlestick.org
            description: TV show management
            icon: sonarr.png
            widget:
              type: sonarr
              url: http://sonarr.arr.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
        - Radarr:
            href: https://radarr.fiddlestick.org
            description: Movie management
            icon: radarr.png
            widget:
              type: radarr
              url: http://radarr.arr.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
        - Bazarr:
            href: https://bazarr.fiddlestick.org
            description: Subtitle management
            icon: bazarr.png
            widget:
              type: bazarr
              url: http://bazarr.arr.svc.cluster.local:6767
              key: "{{HOMEPAGE_VAR_BAZARR_API_KEY}}"

  bookmarks.yaml: |
    []

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: |
    {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      initContainers:
        - name: copy-config
          image: busybox
          command:
            - sh
            - -c
            - cp /config-source/*.yaml /app/config/
          volumeMounts:
            - name: config-source
              mountPath: /config-source
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.12.3
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.fiddlestick.org
            - name: HOMEPAGE_VAR_NAS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homepage-nas
                  key: username
            - name: HOMEPAGE_VAR_NAS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homepage-nas
                  key: password
            - name: HOMEPAGE_VAR_PROXMOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-proxmox
                  key: token
            - name: HOMEPAGE_VAR_PROXMOX_SECRET
              valueFrom:
                secretKeyRef:
                  name: homepage-proxmox
                  key: secret
            - name: HOMEPAGE_VAR_ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-argocd
                  key: token
            - name: HOMEPAGE_VAR_PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homepage-pihole
                  key: password
            - name: HOMEPAGE_VAR_PAPERLESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-paperless
                  key: token
            - name: HOMEPAGE_VAR_CALIBRE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homepage-calibre
                  key: username
            - name: HOMEPAGE_VAR_CALIBRE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homepage-calibre
                  key: password
            - name: HOMEPAGE_VAR_JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-jellyfin
                  key: apikey
            - name: HOMEPAGE_VAR_SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-arr
                  key: sonarr
            - name: HOMEPAGE_VAR_RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-arr
                  key: radarr
            - name: HOMEPAGE_VAR_BAZARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-arr
                  key: bazarr
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
      volumes:
        - name: config-source
          configMap:
            name: homepage-config
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector:
    app: homepage
  ports:
    - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - home.fiddlestick.org
      secretName: homepage-tls
  rules:
    - host: home.fiddlestick.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
