apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-status-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  pod-status.json: |
    {
      "title": "Pod Status",
      "uid": "pod-status",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "tags": ["kubernetes", "pods"],
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "templating": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "All Pods",
          "gridPos": {"h": 24, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {"displayName": "Namespace", "desc": false},
              {"displayName": "Pod", "desc": false}
            ],
            "footer": {"show": false}
          },
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "custom": {
                "align": "left",
                "cellOptions": {"type": "auto"},
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Ready"},
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {"text": "Not Ready", "color": "red", "index": 0},
                          "1": {"text": "Ready",     "color": "green", "index": 1}
                        }
                      }
                    ]
                  },
                  {"id": "custom.cellOptions", "value": {"type": "color-background"}},
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {"value": null,  "color": "red"},
                        {"value": 1,     "color": "green"}
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Restarts (24h)"},
                "properties": [
                  {"id": "unit", "value": "short"},
                  {"id": "decimals", "value": 0},
                  {"id": "custom.cellOptions", "value": {"type": "color-background"}},
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {"value": null, "color": "green"},
                        {"value": 5,    "color": "yellow"},
                        {"value": 10,   "color": "red"}
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "kube_pod_status_ready{condition=\"true\"} unless on(namespace, pod) (kube_pod_status_phase{phase=~\"Succeeded|Failed\"} > 0)",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[24h])) and on(namespace, pod) kube_pod_status_ready{condition=\"true\"} unless on(namespace, pod) (kube_pod_status_phase{phase=~\"Succeeded|Failed\"} > 0)",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {"id": "merge", "options": {}},
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "condition": true,
                  "job": true,
                  "instance": true,
                  "uid": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "service": true
                },
                "indexByName": {
                  "namespace": 0,
                  "pod": 1,
                  "Value #A": 2,
                  "Value #B": 3
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "pod": "Pod",
                  "Value #A": "Ready",
                  "Value #B": "Restarts (24h)"
                }
              }
            }
          ]
        }
      ]
    }
