---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arm-media
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.1.3/volume1/arm#arm-ns
    volumeAttributes:
      server: 192.168.1.3
      share: /volume1/arm
  mountOptions:
    - nfsvers=4.1
