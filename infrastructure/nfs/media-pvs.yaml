---
# Static PV for Jellyfin namespace — mounts root of /volume1/jellyfin
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media
spec:
  capacity:
    storage: 5Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.1.3/volume1/jellyfin#jellyfin-ns
    volumeAttributes:
      server: 192.168.1.3
      share: /volume1/jellyfin
  mountOptions:
    - nfsvers=4.1
