apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-l2
  namespace: metallb-system
spec:
  # Bind this advertisement to the pool defined in ipaddresspool.yaml.
  # In L2 mode MetalLB responds to ARP requests for assigned IPs — no BGP router needed.
  ipAddressPools:
    - homelab-pool
