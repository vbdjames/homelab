apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 3 — after sealed-secrets (wave 0), before kube-prometheus-stack (wave 7)
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default

  source:
    repoURL: git@github.com:vbdjames/homelab.git
    targetRevision: HEAD
    path: infrastructure/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
