apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 7 — after ingress-nginx and cert-manager are ready
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "69.3.2"
    helm:
      values: |
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              isDefault: false
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - grafana.fiddlestick.org
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.fiddlestick.org
          persistence:
            enabled: true
            storageClassName: nfs
            size: 5Gi

        prometheus:
          prometheusSpec:
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi

        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 2Gi
            secrets:
              - alertmanager-smtp
          config:
            global:
              smtp_smarthost: smtp.fastmail.com:465
              smtp_from: doug@dwjames.org
              smtp_auth_username: doug@dwjames.org
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
              smtp_require_tls: false
            route:
              group_by: ['alertname', 'namespace']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: email-critical
              routes:
                - matchers:
                    - severity =~ "warning|info"
                  receiver: email-warning
            receivers:
              - name: email-critical
                email_configs:
                  - to: vbdjames@gmail.com
                    send_resolved: true
              - name: email-warning
                email_configs:
                  - to: vbdjames@gmail.com
                    send_resolved: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # required — kube-prometheus-stack CRDs are too large for client-side apply
