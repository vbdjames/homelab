apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: git@github.com:vbdjames/homelab.git
      targetRevision: HEAD
      path: infrastructure/authentik

    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: "2026.2.2"
      helm:
        values: |
          authentik:
            secret_key: ""
            error_reporting:
              enabled: false
            email:
              host: smtp.fastmail.com
              port: 587
              use_tls: true
              from: "Authentik <noreply@fiddlestick.org>"

          global:
            env:
              - name: AUTHENTIK_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: authentik-secrets
                    key: secret-key
              - name: AUTHENTIK_POSTGRESQL__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: authentik-secrets
                    key: db-password
              - name: AUTHENTIK_EMAIL__USERNAME
                valueFrom:
                  secretKeyRef:
                    name: authentik-secrets
                    key: smtp-username
              - name: AUTHENTIK_EMAIL__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: authentik-secrets
                    key: smtp-password

          postgresql:
            enabled: true
            auth:
              username: authentik
              database: authentik
              existingSecret: authentik-secrets
              secretKeys:
                userPasswordKey: db-password
            primary:
              persistence:
                enabled: true
                storageClass: nfs
                size: 5Gi

          server:
            ingress:
              enabled: true
              ingressClassName: nginx
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-prod
                nginx.ingress.kubernetes.io/proxy-body-size: "0"
              hosts:
                - authentik.fiddlestick.org
              tls:
                - secretName: authentik-tls
                  hosts:
                    - authentik.fiddlestick.org

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
