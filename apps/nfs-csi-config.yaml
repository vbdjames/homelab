apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-csi-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 2 — after nfs-csi driver (wave 1) is running
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  source:
    repoURL: git@github.com:vbdjames/homelab.git
    targetRevision: HEAD
    path: infrastructure/nfs

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
