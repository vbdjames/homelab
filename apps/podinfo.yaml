apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: "6.7.1"

    helm:
      values: |
        service:
          type: ClusterIP
        ui:
          message: "homelab cluster — podinfo smoke test"
        ingress:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: podinfo.fiddlestick.org
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: podinfo-tls
              hosts:
                - podinfo.fiddlestick.org

  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
