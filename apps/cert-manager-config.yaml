apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 4 — after cert-manager (wave 3) so CRDs exist before ClusterIssuer is applied
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default

  source:
    repoURL: git@github.com:vbdjames/homelab.git
    targetRevision: HEAD
    path: infrastructure/cert-manager

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
